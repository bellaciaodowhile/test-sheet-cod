<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Hero Section with Form -->
    <main class="hero" id="hero" role="main">
        <div class="hero-overlay" id="form-contact">
            <div class="hero-content">
                <!-- Logo -->
                <header class="logo" role="banner">
                    <img id="logo-img" src="" alt="" width="100%" height="100%">
                </header>
                
                <!-- Hero Text -->
                <section class="hero-text">
                    <p class="hero-badge" id="hero-badge"></p>
                    <h1 id="hero-title"></h1>
                    <p class="hero-subtitle" id="hero-subtitle"></p>
                </section>
                
                <!-- Lead Form -->
                <section class="main-form" role="form" aria-labelledby="title-form">
                    <h2 class="title-form" id="title-form"></h2>
                    <div class="lead-form-container">
                        <!-- Overlay de carga -->
                        <div class="loading-overlay" id="loading-overlay" aria-hidden="true">
                            <div class="loading-spinner" role="status" aria-label="Cargando"></div>
                            <div class="loading-text">Espere por favor...</div>
                        </div>
                        
                        <form class="lead-form" id="lead-form" novalidate>
                            <!-- Campos ocultos para parámetros UTM -->
                            <input type="hidden" id="utm_source" name="utm_source" value="">
                            <input type="hidden" id="utm_medium" name="utm_medium" value="">
                            <input type="hidden" id="utm_campaign" name="utm_campaign" value="">
                            
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="nombre" class="sr-only">Nombre y apellido</label>
                                    <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellido" required aria-required="true">
                                </div>
                                <div class="input-group">
                                    <label for="telefono" class="sr-only">Teléfono</label>
                                    <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required aria-required="true" inputmode="numeric">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="input-group">
                                    <label for="email" class="sr-only">Correo electrónico</label>
                                    <input type="email" id="email" name="email" placeholder="Email" required aria-required="true" inputmode="email">
                                </div>
                                <div class="input-group">
                                    <label for="carrera" class="sr-only">Carrera de interés</label>
                                    <select id="carrera" name="carrera" required aria-required="true">
                                        <option value="">Carrera de interés</option>
                                        <optgroup label="🎓 Ingenierías">
                                            <option value="Ingeniería Agroindustrial y de Alimentos">Ingeniería Agroindustrial y de Alimentos</option>
                                            <option value="Ingeniería Ambiental y Diseño de Energías Renovables">Ingeniería Ambiental y Diseño de Energías Renovables</option>
                                            <option value="Ingeniería Eléctrica">Ingeniería Eléctrica</option>
                                            <option value="Ingeniería en Gestión Empresarial">Ingeniería en Gestión Empresarial</option>
                                            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                                            <option value="Ingeniería en Manufactura">Ingeniería en Manufactura</option>
                                            <option value="Ingeniería en Seguridad Cibernética">Ingeniería en Seguridad Cibernética</option>
                                            <option value="Ingeniería en Sistemas">Ingeniería en Sistemas</option>
                                        </optgroup>
                                        <optgroup label="📚 Licenciaturas">
                                            <option value="Licenciatura en Administración">Licenciatura en Administración</option>
                                            <option value="Licenciatura en Contaduría Publica">Licenciatura en Contaduría Pública</option>
                                            <option value="Licenciatura en Derecho">Licenciatura en Derecho</option>
                                            <option value="Licenciatura en Diseño Grafico">Licenciatura en Diseño Gráfico</option>
                                            <option value="Licenciatura en Interpretación del Arte">Licenciatura en Interpretación del Arte</option>
                                            <option value="Licenciatura en Logística y Aduanas">Licenciatura en Logística y Aduanas</option>
                                            <option value="Licenciatura en Mercadotecnia">Licenciatura en Mercadotecnia</option>
                                            <option value="Licenciatura en Recursos Humanos">Licenciatura en Recursos Humanos</option>
                                            <option value="Licenciatura en Turismo">Licenciatura en Turismo</option>
                                        </optgroup>
                                    </select>
                                </div>
                            </div>
                            <div class="main-button-submit">
                                <button type="submit" class="whatsapp-btn" aria-describedby="form-note">
                                    <span class="whatsapp-icon" aria-hidden="true">
                                        <img src="assets/images/icon-whatsapp.webp" width="100%" height="100%" alt="Icon Whatsapp" role="presentation">
                                    </span>
                                    <span id="whatsapp-text"></span>
                                </button>
                                <div class="form-note" id="form-note"></div>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Credentials Section -->
    <section class="credentials" id="credentials" role="region" aria-labelledby="credentials-title">
        <div class="container">
            <div class="credentials-content">
                <h2 id="credentials-title"></h2>
                <p id="credentials-subtitle"></p>
                <div class="logos-container" id="logos-container" aria-label="Certificaciones y acreditaciones">
                    <!-- Logos will be populated by JavaScript -->
                </div>
            </div>
            <div class="testimonials" id="testimonials" aria-label="Testimonios de estudiantes">
                <!-- Testimonials will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Benefits Section -->
    <section class="benefits" id="benefits" role="region" aria-labelledby="benefits-heading">
        <div class="container">
            <h2 id="benefits-heading" class="sr-only">Beneficios de estudiar con nosotros</h2>
            <div class="benefits-grid" id="benefits-grid" aria-label="Beneficios de estudiar con nosotros">
                <!-- Benefits will be populated by JavaScript -->
            </div>
            <div class="cta-section">
                <a id="benefits-cta" href="#form-contact" class="cta-button" role="button"></a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>
</body>
